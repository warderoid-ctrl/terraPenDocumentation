name: Publish

on:
  push:
    branches: [ main ]
  # Lets you publish a preview from any branch, via the Actions tab
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      # Canonical URL for the built site. mkdocs.yml reads this via !ENV, so a
      # fork only has to change it here, not in the config.
      SITE_URL: https://warderoid-ctrl.github.io/terraPenDocumentation/

    steps:
      - uses: actions/checkout@v4

      - name: Build the mkdocs image
        run: docker build -t mkdocs-build -f ./dev/Dockerfile .

      - name: Build the site
        run: |
          docker run --rm \
            -e SITE_URL \
            -v "${{ github.workspace }}:/site" \
            --entrypoint mkdocs \
            mkdocs-build build --strict

      - name: Make the output readable by the runner
        run: sudo chown -R "$(id -u):$(id -g)" public

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
